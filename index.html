<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0b2940">
  <title>River Valley Plumbing | Coming Soon</title>
  <meta name="description" content="River Valley Plumbing's new website is coming soon.">
  <style>
    :root { color-scheme: dark; --navy: #0b2940; --deep: #061a2a; --teal: #63d0d0; --white: #f6fbff; --muted: #c2d3de; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body { min-height: 100svh; display: grid; place-items: center; padding: 32px 18px; background: radial-gradient(circle at 50% 7%, #1d5265 0, var(--navy) 38%, var(--deep) 100%); color: var(--white); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
    main { width: min(100%, 620px); text-align: center; padding: 52px 30px 42px; border: 1px solid rgba(255,255,255,.17); background: rgba(10,36,54,.64); border-radius: 26px; box-shadow: 0 24px 75px rgba(0,0,0,.22); }
    .mark { width: 80px; height: 80px; display: inline-grid; place-items: center; margin-bottom: 21px; border-radius: 21px; background: rgba(99,208,208,.13); border: 1px solid rgba(99,208,208,.35); }
    .mark svg { width: 50px; height: 50px; }
    h1 { margin: 0; font-size: clamp(2rem, 7vw, 3.3rem); line-height: 1.12; letter-spacing: -.035em; }
    .rule { height: 3px; width: 66px; background: var(--teal); border-radius: 99px; margin: 27px auto; }
    h2 { margin: 0 0 16px; font-size: clamp(1.3rem, 4vw, 1.7rem); font-weight: 600; color: var(--teal); }
    p { margin: 0 auto; max-width: 420px; font-size: 1.05rem; line-height: 1.65; color: var(--muted); }
    footer { margin-top: 37px; font-size: .8rem; color: #a2b8c5; }
    @media (max-width: 420px) { main { padding: 43px 20px 32px; } }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M32 7C25 18 15 28 15 39a17 17 0 0 0 34 0C49 28 39 18 32 7Z" stroke="#63d0d0" stroke-width="3.6" stroke-linejoin="round"/>
        <path d="M24 41c2 5 7 8 12 8" stroke="#63d0d0" stroke-width="3.6" stroke-linecap="round"/>
      </svg>
    </div>
    <h1>River Valley<br>Plumbing</h1>
    <div class="rule"></div>
    <h2>Our new website is coming soon.</h2>
    <p>We're getting things ready. Check back soon to explore the new River Valley Plumbing website.</p>
    <footer>River Valley Plumbing &middot; Website preview</footer>
  </main>
</body>
</html>
